name: Build and publish ranking

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-window:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.window.outputs.enabled }}
    steps:
      - name: Check refresh start date
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          # First central event in 2026: 11 April. Resume one week before
          # the same calendar date in 2027; pushes use saved results.
          today = datetime.now(ZoneInfo("Europe/Warsaw")).date()
          enabled = os.environ["EVENT_NAME"] == "push" or today >= date(2027, 4, 4)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          print(f"Refresh resumes on 2027-04-04; enabled={enabled}")
          PY

  build:
    needs: refresh-window
    if: needs.refresh-window.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test publication safeguards
        run: python -m unittest test_publication

      - name: Build interface from saved results
        if: github.event_name == 'push'
        run: python build_published_site.py

      - name: Refresh results and build site
        if: github.event_name != 'push'
        run: python bialystok_polfinal.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
